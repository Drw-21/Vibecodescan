# Supabase CLI configuration for local development (`supabase start`).
# Production settings are managed in the Supabase dashboard.
project_id = "scanner"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 100

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
# Milestone 6 switches sign-in to magic links / OAuth only (spec: Account takeover).

# Edge Functions. Imports (zod, supabase-js) are pinned in functions/deno.json.
[functions.create-scan]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.run-scan]
verify_jwt = true
import_map = "./functions/deno.json"
